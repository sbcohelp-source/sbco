[workspace]
members = ["crates/*"]
exclude = ["apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"

[workspace.dependencies]
sbco-domain = { path = "crates/domain" }
sbco-contracts = { path = "crates/contracts" }
sbco-application = { path = "crates/application" }
sbco-infrastructure = { path = "crates/infrastructure" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "rust_decimal", "json", "migrate", "macros"] }
axum = { version = "=0.8.9", features = ["multipart"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
argon2 = "0.5"
base64 = "0.22"
calamine = { version = "=0.37.0", features = ["dates"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "11", features = ["serde-json-impl", "uuid-impl", "no-serde-warnings"] }
utoipa = { version = "5", features = ["uuid", "chrono"] }

[profile.release]
lto = "thin"
strip = true
