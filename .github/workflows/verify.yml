name: Verify migration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web-and-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: sbco
          POSTGRES_DB: sbco
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sbco"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://sbco:test-only-password@localhost:5432/sbco
      SBCO_ADMIN_NAME: Test Administrator
      SBCO_ADMIN_EMAIL: admin@example.test
      SBCO_ADMIN_PASSWORD: test-only-admin-password
      SBCO_INSECURE_LOCAL_HTTP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - run: npm install --global yarn@1.22.22
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: yarn install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --locked -p sbco-infrastructure historical_balances -- --ignored
      - run: yarn format:check && yarn lint && yarn typecheck && yarn test && yarn check:contracts
      - run: yarn build:web && yarn build:desktop-ui
      - run: yarn playwright install --with-deps chromium firefox webkit
      - name: Real database and browser workflows
        run: |
          cargo build --workspace --locked
          target/debug/sbco-api --bootstrap
          target/debug/sbco-api > /tmp/sbco-api.log 2>&1 &
          target/debug/sbco-worker > /tmp/sbco-worker.log 2>&1 &
          yarn workspace @sbco/web start > /tmp/sbco-web.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:8091/health && curl -fsS http://localhost:3091/ > /dev/null && break; sleep 1; done
          python3 tests/integration.py
          python3 tests/setup_import.py
          yarn test:e2e
          yarn test:acceptance
          yarn playwright test --config playwright.onboarding.config.ts
          yarn playwright test --config playwright.training-live.config.ts
      - name: Preserve failed browser and service diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-and-service-failure-evidence
          path: |
            /tmp/sbco-playwright-results/
            /tmp/sbco-acceptance-results/
            /tmp/sbco-onboarding-results/
            /tmp/sbco-training-live-results/
            /tmp/sbco-api.log
            /tmp/sbco-worker.log
            /tmp/sbco-web.log
          if-no-files-found: ignore
          retention-days: 7
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - run: npm install --global yarn@1.22.22 && yarn install --frozen-lockfile && yarn build:desktop-ui
      - run: docker build --build-arg SBCO_BUILD_UID="$(id -u)" -t sbco-desktop-builder -f deploy/Dockerfile.desktop-builder .
      - name: Compile and rehearse local recovery
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work" -w /work -e SBCO_TEST_RESOURCES=/work/apps/desktop/src-tauri/resources sbco-desktop-builder bash -e -c '
            export CARGO_HOME=/tmp/cargo RUSTUP_HOME=/tmp/rustup
            curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.99.1
            export PATH=/tmp/cargo/bin:$PATH
            scripts/package-postgres.sh
            rustup component add rustfmt clippy
            cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
            cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
            cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- --ignored
          '
