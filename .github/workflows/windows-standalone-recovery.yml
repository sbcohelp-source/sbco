name: Diagnose Windows standalone recovery
on:
  workflow_dispatch:
    inputs:
      postgres_zip_url:
        description: Official PostgreSQL 18.6 Windows x64 ZIP URL (EDB or postgresql.org)
        required: true
        default: https://get.enterprisedb.com/postgresql/postgresql-18.6-1-windows-x64-binaries.zip
        type: string
      postgres_zip_sha256:
        description: SHA-256 pin for that exact official ZIP (64 hex characters)
        required: true
        default: fbe23da234ee31547bf8a36d29dfd81e82b849df2d2b78d2eecb43d360252f8c
        type: string
      postgres_root_in_zip:
        description: Relative PostgreSQL root directory inside the ZIP
        required: true
        default: pgsql
        type: string
      license_directory_in_root:
        description: Relative distribution license/documentation directory inside PostgreSQL root
        required: true
        default: doc
        type: string
permissions:
  contents: read
jobs:
  standalone-recovery:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - name: Restore Windows compilation cache
        id: rust-cache
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            apps/desktop/src-tauri/target
          key: windows-2025-rust-v1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-recovery-${{ github.sha }}
          restore-keys: |
            windows-2025-rust-v1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}-
      - name: Prepare pinned build tools
        run: |
          npm install --global yarn@1.22.22
          if ($LASTEXITCODE -ne 0) { throw 'Yarn installation failed.' }
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          rustup default 1.99.1
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed.' }
      - name: Verify and extract the explicitly supplied native PostgreSQL archive
        env:
          SBCO_PG_ZIP_URL: ${{ inputs.postgres_zip_url }}
          SBCO_PG_ZIP_SHA256: ${{ inputs.postgres_zip_sha256 }}
          SBCO_PG_ROOT_IN_ZIP: ${{ inputs.postgres_root_in_zip }}
          SBCO_PG_LICENSE_RELATIVE: ${{ inputs.license_directory_in_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = [uri]$env:SBCO_PG_ZIP_URL
          if ($uri.Scheme -ne 'https' -or $uri.UserInfo -or $uri.Fragment -or $uri.Host -notin @('get.enterprisedb.com', 'download.postgresql.org', 'ftp.postgresql.org')) {
            throw 'Use an explicit HTTPS ZIP URL from the official PostgreSQL/EDB distribution hosts.'
          }
          if ($env:SBCO_PG_ZIP_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'Provide the independently verified ZIP SHA-256.' }
          $archive = Join-Path $env:RUNNER_TEMP 'postgres-windows.zip'
          Invoke-WebRequest -Uri $uri -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ine $env:SBCO_PG_ZIP_SHA256) { throw 'PostgreSQL ZIP checksum mismatch.' }
          $expanded = Join-Path $env:RUNNER_TEMP 'sbco-postgres-windows'
          New-Item -ItemType Directory -Path $expanded | Out-Null
          $prefix = [System.IO.Path]::GetFullPath($expanded) + [System.IO.Path]::DirectorySeparatorChar
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            foreach ($entry in $zip.Entries) {
              $resolved = [System.IO.Path]::GetFullPath((Join-Path $expanded $entry.FullName))
              if (-not $resolved.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) { throw 'ZIP entry escapes the extraction directory.' }
              if ((($entry.ExternalAttributes -shr 16) -band 0xF000) -eq 0xA000) { throw 'ZIP symbolic links are prohibited.' }
            }
          } finally { $zip.Dispose() }
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          foreach ($relative in @($env:SBCO_PG_ROOT_IN_ZIP, $env:SBCO_PG_LICENSE_RELATIVE)) {
            if ([System.IO.Path]::IsPathRooted($relative) -or $relative -match '(^|[\\/])\.\.([\\/]|$)' -or $relative -match '[\r\n]') { throw 'Archive resource locations must be relative subdirectories.' }
          }
          $nativeRoot = Join-Path $expanded $env:SBCO_PG_ROOT_IN_ZIP
          $licenses = Join-Path $nativeRoot $env:SBCO_PG_LICENSE_RELATIVE
          "SBCO_NATIVE_POSTGRES=$nativeRoot" >> $env:GITHUB_ENV
          "SBCO_NATIVE_LICENSES=$licenses" >> $env:GITHUB_ENV
      - name: Prepare packaged native resources and desktop assets
        run: |
          ./scripts/package-postgres-windows.ps1 -PostgresRoot $env:SBCO_NATIVE_POSTGRES -LicenseDirectory $env:SBCO_NATIVE_LICENSES
          yarn install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed.' }
          $env:SBCO_DESKTOP='1'
          yarn workspace '@sbco/web' build
          if ($LASTEXITCODE -ne 0) { throw 'Desktop assets failed.' }
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Windows target unavailable.' }
      - name: Compile the recovery test separately
        timeout-minutes: 25
        run: |
          New-Item -ItemType Directory -Path artifacts/windows-recovery-diagnostic -Force | Out-Null
          cargo test --release --target x86_64-pc-windows-msvc --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --no-run --message-format=json > artifacts/windows-recovery-diagnostic/compile.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Recovery test compilation failed.' }
          $binaries=@(Get-Content artifacts/windows-recovery-diagnostic/compile.jsonl | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.executable -and $_.target.name -eq 'sbco-desktop' } | ForEach-Object { $_.executable })
          if ($binaries.Count -ne 1) { throw 'Expected exactly one desktop test executable.' }
          "SBCO_RECOVERY_TEST_EXE=$($binaries[0])" >> $env:GITHUB_ENV
          $testRoot=Join-Path $env:RUNNER_TEMP ('sbco-recovery-diagnostic-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $testRoot | Out-Null
          "SBCO_RECOVERY_TEST_ROOT=$testRoot" >> $env:GITHUB_ENV
      - name: Run bounded native PostgreSQL lifecycle test
        timeout-minutes: 5
        run: |
          $env:SBCO_TEST_RESOURCES=(Resolve-Path apps/desktop/src-tauri/resources).Path
          $env:SBCO_POSTGRES_BIN=$null; $env:SBCO_POSTGRES_SHARE=$null
          $env:TEMP=$env:SBCO_RECOVERY_TEST_ROOT; $env:TMP=$env:SBCO_RECOVERY_TEST_ROOT
          & $env:SBCO_RECOVERY_TEST_EXE postgres::tests --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL path and recovery unit tests failed.' }
          & $env:SBCO_RECOVERY_TEST_EXE postgres::tests::local_database_survives_restart_and_restores_to_a_new_database --ignored --nocapture 2>&1 | Tee-Object -FilePath artifacts/windows-recovery-diagnostic/lifecycle.log
          if ($LASTEXITCODE -ne 0) { throw 'Native lifecycle test failed.' }
      - name: Collect only sanitized PostgreSQL text logs
        if: always()
        run: |
          if ($env:SBCO_RECOVERY_TEST_ROOT -and (Test-Path -LiteralPath $env:SBCO_RECOVERY_TEST_ROOT)) {
            foreach ($directory in Get-ChildItem -LiteralPath $env:SBCO_RECOVERY_TEST_ROOT -Directory) {
              if ($directory.Name -notmatch '^sbco-lifecycle-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' -or ($directory.Attributes -band [IO.FileAttributes]::ReparsePoint)) { continue }
              $log=Join-Path $directory.FullName 'postgres.log'
              if ((Test-Path -LiteralPath $log -PathType Leaf) -and -not ((Get-Item -LiteralPath $log).Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                Get-Content -LiteralPath $log -Tail 2000 | Where-Object { $_ -notmatch '(?i)password|postgresql://|sbco_session=' } | Set-Content -LiteralPath (Join-Path 'artifacts/windows-recovery-diagnostic' ($directory.Name+'-postgres.log')) -Encoding utf8NoBOM
              }
            }
          }
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-standalone-recovery-diagnostic
          path: artifacts/windows-recovery-diagnostic/
          if-no-files-found: warn
          retention-days: 14
      - name: Save Windows compilation cache
        if: ${{ !cancelled() && steps.rust-cache.outputs.cache-hit != 'true' && steps.rust-cache.outputs.cache-primary-key != '' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            apps/desktop/src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
