  <rect width="493" height="312" fill="#ffffff"/>
  <rect width="164" height="312" fill="#124b3a"/>
  <g transform="translate(18 26) scale(.25)">
    <rect width="256" height="256" rx="48" fill="#124b3a"/>
    <rect x="66" y="58" width="124" height="150" rx="14" fill="none" stroke="#ffffff" stroke-width="12"/>
