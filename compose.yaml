name: sbco-next
services:
  database:
    image: postgres:18.6
    environment:
      POSTGRES_USER: sbco
      POSTGRES_DB: sbco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique URL-safe PostgreSQL password}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbco -d sbco"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment: &backend-environment
      DATABASE_URL: postgresql://sbco:${POSTGRES_PASSWORD}@database:5432/sbco
      RUST_LOG: info
      SBCO_INSECURE_LOCAL_HTTP: ${SBCO_INSECURE_LOCAL_HTTP:-0}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    command: ["sbco-worker"]
    environment: *backend-environment
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports: ["127.0.0.1:3092:3000"]
    depends_on: [api]
    restart: unless-stopped
  backup:
    image: postgres:18.6
    entrypoint: ["bash", "/scheduled-backup.sh"]
    environment:
      PGHOST: database
      PGUSER: sbco
      PGDATABASE: sbco
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backup-data:/backups
      - ./scripts/scheduled-backup.sh:/scheduled-backup.sh:ro
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  bootstrap:
    profiles: [setup]
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    command: ["sbco-api", "--bootstrap"]
    environment:
      <<: *backend-environment
      SBCO_ADMIN_NAME: ${SBCO_ADMIN_NAME:-Administrator}
      SBCO_ADMIN_EMAIL: ${SBCO_ADMIN_EMAIL:-}
      SBCO_ADMIN_PASSWORD: ${SBCO_ADMIN_PASSWORD:-}
    depends_on:
      database:
        condition: service_healthy
volumes:
  postgres-data:
  backup-data:
